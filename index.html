<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ed Cooper — Trader &amp; Investor</title>
<meta name="description" content="Ed Cooper. Trader & investor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F4F1E8;
    --ink:#26221B;
    --ink-soft:#6E6759;
    --brass:#9A7B45;
    --hairline:rgba(38,34,27,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Newsreader',Georgia,serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--brass);color:var(--ivory)}
  a{color:inherit}
  a:focus-visible{outline:1px solid var(--brass);outline-offset:5px}
  img{display:block;max-width:100%;height:auto}

  .caps{
    font-size:.72rem;
    font-weight:500;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1.4rem,5vw,3.5rem)}

  /* ================= IDENTITY ================= */
  .identity{
    text-align:center;
    padding-top:clamp(3.5rem,9vh,6.5rem);
  }
  .name{
    font-family:'Cormorant Garamond',serif;
    font-weight:300;
    font-size:clamp(3.6rem,10vw,7.5rem);
    line-height:1;
    letter-spacing:.01em;
  }
  .role{margin-top:1.6rem}
  .quick{
    margin-top:2.1rem;
    display:flex;justify-content:center;align-items:baseline;
    gap:1.1rem;
  }
  .quick a{
    font-size:.7rem;font-weight:500;
    letter-spacing:.26em;text-transform:uppercase;
    text-decoration:none;color:var(--ink);
    padding-bottom:.35rem;
    border-bottom:1px solid var(--hairline);
    transition:color .3s,border-color .3s;
  }
  .quick a:hover{color:var(--brass);border-color:var(--brass)}
  .quick .dot{color:var(--brass);font-size:.8rem}
  .role .amp{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    text-transform:none;
    letter-spacing:0;
    font-size:1.05rem;
    color:var(--brass);
    padding:0 .35em;
  }

  /* ================= TRIPTYCH ================= */
  .triptych{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:clamp(1.2rem,2.6vw,2.4rem);
    align-items:start;
    padding-top:clamp(3rem,7vh,5rem);
  }
  .triptych figure{
    overflow:hidden;
    position:relative;
  }
  .triptych figure:nth-child(1),
  .triptych figure:nth-child(3){margin-top:clamp(2.6rem,6vw,4.6rem)}
  .triptych .zoom{display:block;will-change:transform}
  .triptych img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    transform:scale(1.001);
    filter:brightness(1) saturate(1);
    transition:transform 1.4s cubic-bezier(.22,1,.36,1),filter 1.4s ease;
    will-change:transform;
  }
  /* slow idle breathing on the wrapper so hover zoom can live on the image */
  .triptych figure:nth-child(1) .zoom{animation:breathe 26s ease-in-out infinite alternate}
  .triptych figure:nth-child(2) .zoom{animation:breathe 30s ease-in-out infinite alternate;animation-delay:-9s}
  .triptych figure:nth-child(3) .zoom{animation:breathe 28s ease-in-out infinite alternate;animation-delay:-18s}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.05)}}
  /* hover: deepen the zoom, lift the light, reveal a brass inner frame */
  .triptych figure::after{
    content:"";
    position:absolute;
    inset:.8rem;
    border:1px solid var(--brass);
    opacity:0;
    transform:scale(.985);
    transition:opacity .7s ease,transform .9s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  @media (hover:hover){
    .triptych figure:hover img{transform:scale(1.06);filter:brightness(1.05) saturate(1.06)}
    .triptych figure:hover::after{opacity:1;transform:scale(1)}
  }

  /* ================= LINKS ================= */
  .find{
    padding:clamp(4rem,10vh,7rem) 0 clamp(3rem,7vh,5rem);
  }
  .find .caps{
    display:block;text-align:center;margin-bottom:2.6rem;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(1.2rem,2.5vw,2rem);
  }
  .plat-card{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:4rem;
    padding:clamp(1.6rem,3vw,2.2rem);
    border:1px solid var(--ink);
    text-decoration:none;
    overflow:hidden;
    transition:color .45s;
  }
  .plat-card::before{
    content:"";
    position:absolute;inset:0;
    background:var(--ink);
    transform:scaleY(0);
    transform-origin:bottom;
    transition:transform .55s cubic-bezier(.22,1,.36,1);
    z-index:0;
  }
  .plat-card > *{position:relative;z-index:1}
  .plat-card .top{display:flex;justify-content:space-between;align-items:flex-start}
  .plat-card .platform{
    font-family:'Cormorant Garamond',serif;
    font-weight:300;
    font-size:clamp(1.9rem,3.5vw,2.5rem);
    line-height:1;
  }
  .plat-card .arrow{
    font-family:'Cormorant Garamond',serif;
    font-weight:300;
    font-size:1.5rem;
    color:var(--brass);
    transform:rotate(-45deg);
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    display:inline-block;
  }
  .plat-card .bottom{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
  .plat-card .handle{
    font-size:.72rem;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-soft);
    transition:color .45s;
  }
  .plat-card .visit{
    font-size:.66rem;font-weight:500;
    letter-spacing:.28em;text-transform:uppercase;
    color:var(--brass);
  }
  @media (hover:hover){
    .plat-card:hover{color:var(--ivory)}
    .plat-card:hover::before{transform:scaleY(1)}
    .plat-card:hover .handle{color:rgba(244,241,232,.65)}
    .plat-card:hover .arrow{transform:rotate(0deg) translateX(3px)}
  }

  /* ================= FOOTER ================= */
  .foot{
    display:flex;align-items:center;justify-content:space-between;
    padding:2rem 0 2.6rem;
    border-top:1px solid var(--hairline);
  }
  .cross{color:var(--brass);font-size:1.05rem;line-height:1}

  /* ================= ENTRANCE ================= */
  .rise{opacity:0;transform:translateY(26px)}
  .loaded .rise{
    opacity:1;transform:none;
    transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1);
  }
  .loaded .d1{transition-delay:.05s}
  .loaded .d2{transition-delay:.3s}
  .loaded .d3{transition-delay:.5s}
  .loaded .d4{transition-delay:.7s}
  .loaded .d5{transition-delay:.9s}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s cubic-bezier(.22,1,.36,1)}
  .reveal.in{opacity:1;transform:none}

  @media (prefers-reduced-motion:reduce){
    .rise,.reveal{opacity:1 !important;transform:none !important;transition:none !important}
    .triptych .zoom{animation:none !important}
    .triptych img{transition:none}
    .triptych figure::after{transition:none}
    .plat-card::before,.plat-card .arrow{transition:none}
  }

  /* ================= MOBILE ================= */
  @media (max-width:760px){
    .triptych{
      display:flex;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      gap:1rem;
      padding-bottom:.5rem;
      margin:0 calc(-1 * clamp(1.4rem,5vw,3.5rem));
      padding-left:clamp(1.4rem,5vw,3.5rem);
      padding-right:clamp(1.4rem,5vw,3.5rem);
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .triptych::-webkit-scrollbar{display:none}
    .triptych figure{
      flex:0 0 62vw;
      scroll-snap-align:center;
      margin-top:0 !important;
    }
    .identity{padding-top:2.6rem}
    .triptych{padding-top:2.2rem}
    .find{padding-top:3rem}
    .card-grid{grid-template-columns:1fr}
    .plat-card{gap:2.6rem}
  }
</style>
</head>
