<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ed Cooper</title>
  <meta name="description" content="Trader & investor based in London">
  <meta name="theme-color" content="#0c1410">
  <meta property="og:title" content="Ed Cooper">
  <meta property="og:description" content="Trader & investor based in London">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://edcooper.co">
  <meta property="og:image" content="https://edcooper.co/assets/avatar.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ed Cooper">
  <meta name="twitter:description" content="Trader & investor based in London">
  <meta name="twitter:image" content="https://edcooper.co/assets/avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.92);
      --glass: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.22);
      --pill: rgba(255, 255, 255, 0.10);
      --pill-border: rgba(255, 255, 255, 0.32);
      --pill-hover: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #0c1410;
    }

    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }

    /* Subtle darkening only — keeps the waterfall visible, helps white type */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.18);
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.35rem 3.5rem;
      padding-top: max(3rem, env(safe-area-inset-top));
      padding-bottom: max(3.5rem, env(safe-area-inset-bottom));
    }

    .avatar {
      width: 8.25rem;
      height: 8.25rem;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      border: 3px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.28);
      display: block;
    }

    h1 {
      margin-top: 1.7rem;
      font-size: clamp(2.35rem, 8vw, 3.15rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.1;
      text-align: center;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.35);
    }

    h1 .last {
      font-style: italic;
      font-weight: 600;
    }

    .cross {
      margin-top: 1.15rem;
      display: block;
      width: 0.82rem;
      height: 1.35rem;
      fill: #fff;
      filter: drop-shadow(0 1px 8px rgba(0, 0, 0, 0.4));
    }

    .bio {
      margin-top: 0.85rem;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text-soft);
      text-align: center;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
    }

    .card {
      width: 100%;
      max-width: 26.5rem;
      margin-top: 1.85rem;
      padding: 1.2rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 1.75rem;
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    }

    .card a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 3.35rem;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      background: var(--pill);
      border: 1px solid var(--pill-border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .card a:hover {
      background: var(--pill-hover);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .card a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .card a svg {
      width: 1.2rem;
      height: 1.2rem;
      flex-shrink: 0;
      display: block;
    }

    @media (min-width: 640px) {
      .card { max-width: 32rem; }
      .avatar { width: 8.9rem; height: 8.9rem; }
    }

    @media (max-height: 700px) {
      main { padding-top: 1.5rem; padding-bottom: 1.5rem; }
      h1 { margin-top: 1.1rem; }
      .cross { margin-top: 0.7rem; }
      .card { margin-top: 1.15rem; }
    }
  </style>
</head>
<body>
  <img
    class="bg"
    src="assets/bg.jpg"
    srcset="assets/bg-mobile.jpg 1200w, assets/bg.jpg 1920w"
    sizes="100vw"
    alt=""
    draggable="false"
  >
  <div class="overlay" aria-hidden="true"></div>
  <main>
    <img class="avatar" src="assets/avatar.jpg" width="400" height="400" alt="Ed Cooper">
    <h1><span class="first">Ed </span><span class="last">Cooper</span></h1>
    <svg class="cross" viewBox="0 0 24 40" aria-hidden="true" focusable="false">
      <rect x="10.25" y="0" width="3.5" height="40" rx="0.35"/>
      <rect x="7.4" y="3.5" width="9.2" height="3.4" rx="0.3"/>
      <rect x="3" y="12" width="18" height="3.6" rx="0.3"/>
      <g transform="rotate(28 12 29.2)">
        <rect x="4.4" y="27.5" width="15.2" height="3.4" rx="0.3"/>
      </g>
    </svg>
    <p class="bio">Trader &amp; investor based in London</p>
    <div class="card">
      <a href="https://www.instagram.com/e.dcooper/" target="_blank" rel="noopener noreferrer">
        <span>@e.dcooper</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <title>Instagram</title>
          <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="17.4" cy="6.6" r="1.15" fill="currentColor"/>
        </svg>
      </a>
      <a href="https://www.youtube.com/@ed.cooper" target="_blank" rel="noopener noreferrer">
        <span>@ed.cooper</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <title>YouTube</title>
          <path fill="currentColor" d="M23.5 6.2a3.1 3.1 0 0 0-2.18-2.2C19.4 3.55 12 3.55 12 3.55s-7.4 0-9.32.45A3.1 3.1 0 0 0 .5 6.2 32 32 0 0 0 0 12a32 32 0 0 0 .5 5.8 3.1 3.1 0 0 0 2.18 2.2c1.92.45 9.32.45 9.32.45s7.4 0 9.32-.45a3.1 3.1 0 0 0 2.18-2.2A32 32 0 0 0 24 12a32 32 0 0 0-.5-5.8zM9.75 15.5v-7l6.5 3.5-6.5 3.5z"/>
        </svg>
      </a>
      <a href="https://x.com/edcooper" target="_blank" rel="noopener noreferrer">
        <span>@edcooper</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <title>X</title>
          <path fill="currentColor" d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-4.71-6.23-5.4 6.23H2.74l7.73-8.84L1.25 2.25H8.08l4.25 5.62 5.91-5.62zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64z"/>
        </svg>
      </a>
    </div>
  </main>
</body>
</html>
